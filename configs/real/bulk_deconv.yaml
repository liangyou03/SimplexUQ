experiment: real_bulk_deconv

data:
  celltype_key: cell_type
  n_samples: 5000
  cells_per_sample: 200
  concentration: 1.0    # Dirichlet param: <1 sparse, =1 uniform, >1 balanced
  noise_sd: 0.1

conformal:
  alpha: 0.1
  n_reps: 200
  cal_frac: 0.4
  methods:
    - global
    - partition
    - twostage
    # - fullcp  # O(n_cal x n_test); run separately or reduce n_samples first

evaluation:
  n_strata: 5
  strata_method: boundary    # boundary | entropy | kmeans

seed: 2026
